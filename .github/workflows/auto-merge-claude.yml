# Automatically merge every push to a claude/* branch into main,
# so changes made in Claude Code sessions deploy to the live site
# (Render / Railway deploy from main) without a manual PR merge.
#
# Note: this means Claude session work goes live with no review.
# Delete this file to turn auto-merge off.

name: Auto-merge Claude branches into main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the pushed branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "main already contains $BRANCH; nothing to do."
            exit 0
          fi
          # Fails (and leaves main untouched) if there is a merge conflict.
          git merge --no-edit "origin/$BRANCH" -m "Auto-merge $BRANCH into main"
          git push origin HEAD:main
